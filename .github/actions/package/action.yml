name: package
description: install the build into a staging folder and archive it (no game data)

inputs:
  name:
    description: archive base name, e.g. progman31lua-windows-x64
    required: true
  configuration:
    required: false
    default: Release
  format:
    description: zip or tar.gz
    required: false
    default: zip

outputs:
  path:
    description: path of the archive
    value: ${{steps.archive.outputs.path}}

runs:
  using: "composite"
  steps:
    - name: Install to staging folder
      run: cmake --install build --config ${{inputs.configuration}} --component game --prefix "stage/Progman31lua"
      shell: bash

    # Packages hold the host and its scripts only. Fail if anything that
    # looks like a Windows 3.1 file (PROGMAN.EXE, .GRP groups, fonts, the
    # logo, setup-disk files) got staged.
    - name: Check for game content
      run: |
        bad=$(find stage -type f \( -iname '*.hlp' -o -iname '*.bmp' -o -iname '*.ini' -o -iname '*.dll' -o -iname '*.grp' -o -iname '*.fon' -o -iname '*.rle' -o -iname '*.drv' -o -iname '*_' -o -iname '*.exe' -a ! -iname 'progman31lua.exe' \) )
        if [ -n "$bad" ]; then echo "game content in the package:"; echo "$bad"; exit 1; fi
      shell: bash

    - name: Archive
      id: archive
      run: |
        version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
        mkdir -p dist
        out="dist/${{inputs.name}}-$version.${{inputs.format}}"
        case "${{inputs.format}}" in
          zip)
            if command -v 7z >/dev/null; then (cd stage && 7z a -tzip "../$out" Progman31lua >/dev/null)
            else (cd stage && zip -qr "../$out" Progman31lua); fi ;;
          tar.gz) tar -C stage -czf "$out" Progman31lua ;;
        esac
        echo "path=$out" >> "$GITHUB_OUTPUT"
        ls -l dist
      shell: bash
